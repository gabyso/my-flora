services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: my_flora
      POSTGRES_PASSWORD: my_flora
      POSTGRES_USER: my_flora
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U my_flora -d my_flora
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - my-flora-postgres:/var/lib/postgresql/data

volumes:
  my-flora-postgres:
